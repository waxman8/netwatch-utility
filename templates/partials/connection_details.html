{% if wifi_info %}
<div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-6 items-center justify-between">
    <div class="flex items-center gap-4">
        <div class="bg-blue-500/20 p-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0" />
            </svg>
        </div>
        <div>
            <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">Network Name (SSID)</div>
            <div class="text-lg font-semibold text-white">{{ wifi_info.ssid }}</div>
        </div>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-8">
        <div>
            <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">Frequency</div>
            <div class="text-md font-medium text-slate-200">{{ wifi_info.type or 'Unknown' }}</div>
        </div>
        <div>
            <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">Channel</div>
            <div class="text-md font-medium text-slate-200">{{ wifi_info.channel }}</div>
        </div>
        <div>
            <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">Signal</div>
            <div class="text-md font-medium text-slate-200">{{ wifi_info.signal }}</div>
        </div>
        <div>
            <div class="text-xs text-slate-400 uppercase font-bold tracking-wider">PHY Mode</div>
            <div class="text-md font-medium text-slate-200">{{ wifi_info.phy_mode }}</div>
        </div>
    </div>
</div>
{% endif %}
