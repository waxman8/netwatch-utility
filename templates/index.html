<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connectivity Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .status-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="bg-slate-800 border-b border-slate-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full status-pulse"></span>
                NetWatch Utility
            </h1>
            <div class="text-sm text-slate-400">
                Interval: {{ settings.POLL_INTERVAL }}s
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6 space-y-6">
        <!-- Live Status Grid (HTMX Polled) -->
        <div id="status-grid" 
             hx-get="/components/status" 
             hx-trigger="every {{ settings.POLL_INTERVAL }}s"
             hx-swap="innerHTML">
            <div class="flex justify-center p-12">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>
            </div>
        </div>

        <!-- Latency Chart -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold mb-4 text-slate-300">Latency History (Last 60s)</h2>
            <div class="h-64">
                <canvas id="latencyChart"></canvas>
            </div>
        </div>

        <!-- Recent Outages Panel (HTMX Polled) -->
        <div id="outages-panel"
             hx-get="/components/outages"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 animate-pulse">
                <div class="h-6 w-48 bg-slate-700 rounded mb-4"></div>
                <div class="space-y-3">
                    <div class="h-10 bg-slate-700 rounded"></div>
                    <div class="h-10 bg-slate-700 rounded"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ctx = document.getElementById('latencyChart');
        let chart;

        function initChart() {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Avg Latency (ms)',
                        data: [],
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        x: {
                            display: false
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        async function updateChart() {
            const response = await fetch('/api/stats');
            const data = await response.json();
            
            if (data.history && data.history.length > 0) {
                const labels = data.history.map(h => h.timestamp);
                const values = data.history.map(h => {
                    const validLatencies = h.results
                        .filter(r => r.success && r.latency !== null)
                        .map(r => r.latency);
                    return validLatencies.length > 0 
                        ? validLatencies.reduce((a, b) => a + b) / validLatencies.length 
                        : 0;
                });

                chart.data.labels = labels;
                chart.data.datasets[0].data = values;
                chart.update('none'); // Update without animation for performance
            }
        }

        initChart();
        setInterval(updateChart, {{ settings.POLL_INTERVAL * 1000 }});
    </script>
</body>
</html>
